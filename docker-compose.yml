services:
  timesheet:
    build: .
    container_name: timesheet-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a strong random value}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a strong random value}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - DB_PATH=/app/server/data/timesheet.db
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - POWERBI_API_ENABLED=${POWERBI_API_ENABLED:-true}
      - POWERBI_API_BASE_PATH=${POWERBI_API_BASE_PATH:-/api/powerbi}
      - POWERBI_API_KEY=${POWERBI_API_KEY:-}
      - POWERBI_MAX_RECORDS=${POWERBI_MAX_RECORDS:-50000}
      - POWERBI_CACHE_TTL=${POWERBI_CACHE_TTL:-60}
    volumes:
      - timesheet-data:/app/server/data
      - timesheet-uploads:/app/server/uploads
      - timesheet-logs:/app/server/logs
      - timesheet-backup:/app/server/backup
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  timesheet-data:
    driver: local
  timesheet-uploads:
    driver: local

  timesheet-logs:
    driver: local
  timesheet-backup:
    driver: local
