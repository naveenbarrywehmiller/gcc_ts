name: GCC Timesheet Linux Admin
on:
  push:
    branches: [main]
    tags: ['gcc-timesheet-linux-admin-v*', 'timesheet-admin-v*']
    paths: ['deploy/linux-admin/**', '.github/workflows/linux-admin.yml']
  pull_request:
    paths: ['deploy/linux-admin/**', '.github/workflows/linux-admin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, behavior and documentation checks
        run: |
          bash -n deploy/linux-admin/install.sh deploy/linux-admin/timesheet
          python3 -m compileall -q deploy/linux-admin
          python3 -m unittest discover -s deploy/linux-admin/tests -p 'test_*.py' -v
          python3 deploy/linux-admin/build_release.py --check
      - name: Build this revision's application for the deployment smoke test
        run: docker build -t ghcr.io/naveenbarrywehmiller/gcc_ts:admin-ci .
      - name: Actual Ubuntu install, Docker, Nginx, backup, restore and reset
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/linux-admin/tests/smoke_ubuntu.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo tail -n 250 /var/log/gcc-timesheet-admin/admin.log || true
          sudo docker logs --tail 150 timesheet-app || true
      - name: Build release assets
        run: python3 deploy/linux-admin/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: gcc-timesheet-linux-admin
          path: deploy/dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/gcc-timesheet-linux-admin-v') || startsWith(github.ref, 'refs/tags/timesheet-admin-v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gcc-timesheet-linux-admin
          path: deploy/dist/
      - name: Publish administrator release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat deploy/linux-admin/VERSION)
          case "$RELEASE_TAG" in
            "gcc-timesheet-linux-admin-v$version"|"timesheet-admin-v$version") ;;
            *) echo 'Release tag must match deploy/linux-admin/VERSION' >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" deploy/dist/* \
            --verify-tag --latest=false \
            --title "GCC Timesheet Linux Admin $(cat deploy/linux-admin/VERSION)" \
            --notes-file deploy/linux-admin/RELEASE_NOTES.md
